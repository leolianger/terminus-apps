apiVersion: apps/v1
kind: Deployment
metadata:
  name: finceptterminal
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: finceptterminal-app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: finceptterminal-app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: finceptterminal-app
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: init-chmod-data
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          env:
            - name: CHART_USERSPACE_APPDATA
              value: {{ .Values.userspace.appData | quote }}
            - name: CHART_RELEASE_NAME
              value: {{ .Release.Name | quote }}
          command:
            - sh
            - "-c"
            - |
              echo "finceptterminal init: userspace.appData=[${CHART_USERSPACE_APPDATA}] (release=[${CHART_RELEASE_NAME}])"
              mkdir -p /data
              chmod 777 /data
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsUser: 0
      containers:
        - name: finceptterminal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          env:
            - name: TZ
              value: {{ .Values.timezone | default "Etc/UTC" | quote }}
            - name: HOME
              value: /data
            - name: XDG_CONFIG_HOME
              value: /data/.config
            - name: XDG_DATA_HOME
              value: /data/.local/share
            - name: DISPLAY
              value: ":0"
{{- with .Values.extraEnv }}
{{ toYaml . | nindent 12 }}
{{- end }}
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f FinceptTerminal >/dev/null 2>&1 || exit 1
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f FinceptTerminal >/dev/null 2>&1 || exit 1
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f FinceptTerminal >/dev/null 2>&1 || exit 1
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: data
          hostPath:
            path: '{{ .Values.userspace.appData | default "" }}'
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
      restartPolicy: Always
