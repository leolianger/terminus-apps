apiVersion: apps/v1
kind: Deployment
metadata:
  name: finceptterminal
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: finceptterminal-app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: finceptterminal-app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: finceptterminal-app
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: init-chmod-data
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          env:
            - name: CHART_USERSPACE_APPDATA
              value: {{ .Values.userspace.appData | quote }}
            - name: CHART_RELEASE_NAME
              value: {{ .Release.Name | quote }}
          command:
            - sh
            - "-c"
            - |
              echo "finceptterminal init: userspace.appData=[${CHART_USERSPACE_APPDATA}] (release=[${CHART_RELEASE_NAME}])"
              mkdir -p /data
              chmod 777 /data
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsUser: 0
      containers:
        - name: finceptterminal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.timezone | default "Etc/UTC" | quote }}
            - name: HOME
              value: /data
            - name: XDG_CONFIG_HOME
              value: /data/.config
            - name: XDG_DATA_HOME
              value: /data/.local/share
            - name: DISPLAY
              value: ":0"
            - name: SCREEN_WIDTH
              value: {{ .Values.display.width | default 1920 | quote }}
            - name: SCREEN_HEIGHT
              value: {{ .Values.display.height | default 1080 | quote }}
            - name: SCREEN_DEPTH
              value: {{ .Values.display.depth | default 24 | quote }}
            - name: NOVNC_PORT
              value: "8080"
            - name: VNC_PORT
              value: "5900"
{{- with .Values.extraEnv }}
{{ toYaml . | nindent 12 }}
{{- end }}
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: data
          hostPath:
            path: '{{ .Values.userspace.appData | default "" }}'
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: finceptterminal
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: finceptterminal-app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    io.kompose.service: finceptterminal-app
