---
apiVersion: v1
kind: ConfigMap
metadata:
  name: finceptterminal-gateway-config
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    server {
      listen 8080;
      server_name _;

      default_type text/plain;
      location /health {
        return 200 'ok\n';
      }
      location / {
        return 200 'Fincept Terminal: Olares entrance is up. The native Qt process runs in the finceptterminal Deployment; use X11 / DISPLAY per upstream Docker docs.\n';
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finceptterminal-gateway
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: finceptterminal-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: finceptterminal-gateway
  strategy: {}
  template:
    metadata:
      labels:
        io.kompose.service: finceptterminal-gateway
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: finceptterminal-gateway-config
            defaultMode: 438
            items:
              - key: nginx.conf
                path: nginx.conf
      containers:
        - name: nginx
          image: "{{ .Values.imageGateway.repository }}:{{ .Values.imageGateway.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: OPENRESTY_CONF_FILE
              value: /etc/nginx/nginx.conf
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config
              mountPath: /opt/bitnami/openresty/nginx/conf/server_blocks/nginx.conf
              subPath: nginx.conf
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: finceptterminal
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: finceptterminal-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    io.kompose.service: finceptterminal-gateway
