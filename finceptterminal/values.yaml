# Upstream: https://github.com/Fincept-Corporation/FinceptTerminal
#
# This chart pulls a pre-built Olares-flavored image (Xvfb + fluxbox + x11vnc +
# noVNC wrapped around the upstream Qt binary). The image is produced by
# .github/workflows/docker-olares.yml in the FinceptTerminal repo on push to
# main / tag v*. Bump `image.tag` in lockstep with the workflow's
# DOCKER_IMAGE_TAG.
image:
  repository: docker.io/goai007/finceptterminal-olares
  tag: "4.0.2"
  # Always: after rebuilding/pushing the same tag, Olares nodes refetch layers
  # instead of keeping a stale image cache.
  pullPolicy: Always

# Optional extra env for the main container.
extraEnv: []

# noVNC / Xvfb tuning. The noVNC client auto-fits the canvas to the browser
# viewport, but the underlying X server runs at this resolution.
display:
  width: 1920
  height: 1080
  depth: 24

timezone: "Etc/UTC"

userspace:
  appData: ""
