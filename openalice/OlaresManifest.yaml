---
olaresManifest.version: "0.11.0"
olaresManifest.type: app
metadata:
  name: openalice
  icon: https://raw.githubusercontent.com/TraderAlice/OpenAlice/master/ui/public/alice.ico
  description: Your one-person Wall Street. A file-driven AI trading agent for cross-asset research, decision, and execution.
  appid: openalice
  title: OpenAlice
  version: "1.0.1"
  categories:
    - Utilities

entrances:
  - name: openalice
    port: 3002
    host: openalice
    title: OpenAlice
    icon: https://raw.githubusercontent.com/TraderAlice/OpenAlice/master/ui/public/alice.ico
    authLevel: private
    openMethod: window

spec:
  versionName: "0.50.0-beta.1"
  fullDescription: |
    OpenAlice is your one-person Wall Street: an AI trading agent covering equities,
    crypto, commodities, forex, and macro from research through position entry,
    ongoing management, and exit.

    Core capabilities:
    - Full-spectrum: analyze and trade across multiple asset classes in one workspace.
    - Full-lifecycle: not only entry signals, but sizing, monitoring, risk controls, and exits.
    - Full-control: every execution requires explicit approval with auditable history.

    Trading engine:
    - Unified Trading Account (UTA): each account is an isolated workspace with broker connection,
      guard rules, and operation history.
    - Trading-as-Git: stage orders, commit with a message, push to execute.
    - Guard pipeline: pre-trade checks such as max position size, cooldown, and symbol whitelist.

    Research and automation:
    - Market and fundamental research across asset classes, plus RSS news collection.
    - Event-driven automation with cron scheduling and heartbeat monitoring.
    - Multi-provider AI (Claude Agent SDK or Vercel AI SDK providers), switchable at runtime.

    Interfaces:
    - Web UI chat, dashboard, and configuration management.
    - Telegram connector for mobile workflows.
    - MCP server for external agent integration.

    OpenAlice runs on your own machine so keys and capital stay under your control.
  upgradeDescription: |
    Initial Olares package.
  developer: TraderAlice
  website: https://traderalice.com
  sourceCode: https://github.com/TraderAlice/OpenAlice
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  doc: https://github.com/TraderAlice/OpenAlice
  license:
    - text: AGPL-3.0-only
      url: https://github.com/TraderAlice/OpenAlice/blob/master/LICENSE
  requiredMemory: 512Mi
  limitedMemory: 2Gi
  requiredDisk: 512Mi
  limitedDisk: 5Gi
  requiredCpu: 500m
  limitedCpu: "2"
  supportArch:
    - amd64
    - arm64

permission:
  appData: true
  appCache: true

options:
  apiTimeout: 0
  dependencies:
    - name: olares
      type: system
      version: ">=1.12.2-0"
