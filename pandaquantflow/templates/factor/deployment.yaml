---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panda-factor
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/name: panda-factor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: panda-factor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panda-factor
    spec:
      containers:
        - name: panda-factor
          image: "docker.io/goai007/panda_factor:20260617"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.service.factorPort }}
          env:
            - name: MONGO_URI
              value: "panda-mongodb:{{ .Values.service.mongodbPort }}"
            - name: MONGO_USER
              value: "{{ .Values.mongodb.user }}"
            - name: MONGO_PASSWORD
              value: "{{ .Values.mongodb.password }}"
            - name: MONGO_AUTH_DB
              value: "{{ .Values.mongodb.authDb }}"
            - name: MONGO_DB
              value: "{{ .Values.mongodb.database }}"
            - name: MONGO_TYPE
              value: "single"
          startupProbe:
            tcpSocket:
              port: {{ .Values.service.factorPort }}
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.factorPort }}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: panda-factor
  namespace: "{{ .Release.Namespace }}"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.factorPort }}
      targetPort: {{ .Values.service.factorPort }}
  selector:
    app.kubernetes.io/name: panda-factor
