---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pandaquantflow-gateway-config
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    server {
      listen 8000;
      server_name _;
      access_log /opt/bitnami/openresty/nginx/logs/access.log;
      error_log /opt/bitnami/openresty/nginx/logs/error.log;

      client_max_body_size 100m;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_hide_header X-Frame-Options;
      proxy_buffering off;

      location = /healthz {
        default_type text/plain;
        return 200 'ok';
      }

      location ^~ /api/ {
        proxy_pass http://pandaquantflow-server:8000;
      }

      location ^~ /quantflow/ {
        proxy_pass http://pandaquantflow-server:8000;
      }

      location ^~ /charts/ {
        proxy_pass http://pandaquantflow-server:8000;
      }

      # Olares Open uses https://<route-id>.<user>.olares.com/ (no path).
      # Map entrance root to QuantFlow UI, same pattern as freqtrade/nofx gateways.
      location / {
        proxy_pass http://pandaquantflow-server:8000/quantflow/;
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pandaquantflow-gateway
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: pandaquantflow-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: pandaquantflow-gateway
  template:
    metadata:
      labels:
        io.kompose.service: pandaquantflow-gateway
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: pandaquantflow-gateway-config
            defaultMode: 438
            items:
              - key: nginx.conf
                path: nginx.conf
      containers:
        - name: nginx
          image: "docker.io/beclab/aboveos-bitnami-openresty:1.25.3-2"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: OPENRESTY_CONF_FILE
              value: /etc/nginx/nginx.conf
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
              scheme: HTTP
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config
              mountPath: /opt/bitnami/openresty/nginx/conf/server_blocks/nginx.conf
              subPath: nginx.conf
      restartPolicy: Always

---
# Olares entrance (host: pandaquantflow, port: 8000) resolves to this Service.
apiVersion: v1
kind: Service
metadata:
  name: pandaquantflow
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: pandaquantflow-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: pandaquantflow-gateway
