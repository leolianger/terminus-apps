---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pandaquantflow
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: pandaquantflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      io.kompose.service: pandaquantflow
  template:
    metadata:
      labels:
        io.kompose.service: pandaquantflow
    spec:
      containers:
        - name: pandaquantflow
          image: "docker.io/goai007/panda_quantflow:20260617"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.service.quantflowPort }}
          env:
            - name: RUN_MODE
              value: "LOCAL"
            - name: MONGO_URI
              value: "panda-mongodb:{{ .Values.service.mongodbPort }}"
            - name: DATABASE_NAME
              value: "{{ .Values.mongodb.database }}"
            - name: MONGO_USER
              value: "{{ .Values.mongodb.user }}"
            - name: MONGO_PASSWORD
              value: "{{ .Values.mongodb.password }}"
            - name: MONGO_AUTH_DB
              value: "{{ .Values.mongodb.authDb }}"
            - name: MONGO_TYPE
              value: "single"
          startupProbe:
            httpGet:
              path: /
              port: {{ .Values.service.quantflowPort }}
              scheme: HTTP
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.quantflowPort }}
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.quantflowPort }}
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: pandaquantflow-server
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: pandaquantflow
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.quantflowPort }}
      targetPort: {{ .Values.service.quantflowPort }}
  selector:
    io.kompose.service: pandaquantflow
