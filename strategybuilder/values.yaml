app:
  name: strategybuilderdev
  version: 1.2.20
  outputDir: /app/data/strategies
  roots: /app/data,/app/data/strategies,/tmp
image:
  repository: tiangolo/uvicorn-gunicorn-fastapi
  tag: python3.11-slim
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8010
  targetPort: 8010
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 768Mi
userspace:
  appData: ''
