---
olaresManifest.version: "0.11.0"
olaresManifest.type: app
metadata:
  name: worldmonitor
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  description: Real-time global intelligence dashboard with maps, briefs, and signal tracking.
  appid: worldmonitor
  title: World Monitor
  version: "1.0.0"
  categories:
    - Utilities
    - Productivity_v112
entrances:
  - name: worldmonitor
    port: 3000
    host: worldmonitor
    title: World Monitor
    icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
    authLevel: private
    openMethod: window

spec:
  versionName: "2.5.23"
  fullDescription: |
    World Monitor is a real-time global intelligence dashboard for tracking geopolitics, markets, infrastructure, disasters, and OSINT signals in one interface.

    It combines an interactive global map, AI-generated briefs, curated news feeds, and signal panels for military, cyber, finance, climate, and logistics events.

    This package deploys the self-hosted stack used by the upstream Docker setup:
    - Main web application
    - Redis data store
    - Upstash-compatible Redis REST proxy
    - AIS relay sidecar

    Optional API keys can be configured in values.yaml to unlock richer data sources.
  developer: koala73
  website: https://worldmonitor.app/
  sourceCode: https://github.com/leolianger/worldmonitor
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  requiredMemory: 2048Mi
  limitedMemory: 7Gi
  requiredDisk: 1Gi
  limitedDisk: 10Gi
  requiredCpu: "1"
  limitedCpu: "3.5"
  doc: https://github.com/koala73/worldmonitor/blob/main/SELF_HOSTING.md
  license:
    - text: AGPL-3.0
      url: https://github.com/koala73/worldmonitor/blob/main/LICENSE
  supportArch:
    - amd64
    - arm64

permission:
  appData: true
  appCache: false

options:
  apiTimeout: 0
  dependencies:
    - name: olares
      type: system
      version: ">=1.12.5-0"