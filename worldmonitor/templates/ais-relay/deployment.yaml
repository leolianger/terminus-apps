{{- if ne (.Values.env.aistreamApiKey | default "" | trim) "" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worldmonitor-ais-relay
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: worldmonitor-ais-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: worldmonitor-ais-relay
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: worldmonitor-ais-relay
    spec:
      containers:
        - name: worldmonitor-ais-relay
          image: "docker.io/goai007/worldmonitor-ais-relay:2.5.23"
          imagePullPolicy: "IfNotPresent"
          ports:
            - containerPort: 3004
          envFrom:
            - secretRef:
                name: worldmonitor-env
          env:
            - name: PORT
              value: "3004"
            - name: TZ
              value: {{ .Values.timezone | quote }}
          resources:
{{ toYaml .Values.resources.relay | indent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: worldmonitor-ais-relay
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: worldmonitor-ais-relay
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3004
      targetPort: 3004
  selector:
    io.kompose.service: worldmonitor-ais-relay
{{- end }}