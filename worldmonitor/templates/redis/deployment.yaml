apiVersion: apps/v1
kind: Deployment
metadata:
  name: worldmonitor-redis
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: worldmonitor-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: worldmonitor-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: worldmonitor-redis
    spec:
      containers:
        - name: worldmonitor-redis
          image: "docker.io/redis:7-alpine"
          imagePullPolicy: "IfNotPresent"
          command:
            - redis-server
            - --maxmemory
            - {{ .Values.redis.maxMemory | quote }}
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
          resources:
{{ toYaml .Values.resources.redis | indent 12 }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
          startupProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: redis-data
          hostPath:
            path: '{{ .Values.userspace.appData | default "" }}/{{ .Values.redis.storageSubPath }}'
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: worldmonitor-redis
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: worldmonitor-redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    io.kompose.service: worldmonitor-redis